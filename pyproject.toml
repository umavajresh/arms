[project]
name = "arms"
version = "2.0.0"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
known_first_party = ["apps", "config"]
skip_glob = ["*/migrations/*"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]
