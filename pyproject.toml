[project]
name = "arms"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "Django==6.0.10",
    "dj-database-url==2.3.0",
    "gunicorn==26.2.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.8",
    "requests==2.34.2",
    "whitenoise==6.12.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
known_first_party = ["apps", "config"]
skip_glob = ["*/migrations/*"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]
