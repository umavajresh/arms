name: Update production database

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 20 * * *"
  workflow_dispatch:

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secret.outputs.ready }}
    steps:
      - id: secret
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Database update skipped::Add the PRODUCTION_DATABASE_URL repository secret to update the database automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_CONN_MAX_AGE: "0"
      SECRET_KEY: database-update-only
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py import_data --if-empty
      - run: python manage.py generate_recurring_flights --days 30
