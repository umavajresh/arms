name: Migrate production database

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-database-migrations
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secret.outputs.ready }}
    steps:
      - id: secret
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Migrations skipped::Add the PRODUCTION_DATABASE_URL repository secret to apply migrations automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_CONN_MAX_AGE: "0"
      SECRET_KEY: migrations-only
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py showmigrations --plan | tail -n 5
