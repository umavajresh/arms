services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arms
      POSTGRES_USER: arms
      POSTGRES_PASSWORD: arms
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arms -d arms"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://arms:arms@db:5432/arms
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media-dev:/app/media
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["production"]
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:-local-production-like-secret-change-me}
      DATABASE_URL: postgres://arms:arms@db:5432/arms
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    ports:
      - "8001:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  media-dev:
  media:
