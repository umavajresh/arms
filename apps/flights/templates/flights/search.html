{% extends "base.html" %}
{% block pageContent %}
<section class="py-4">
    <div class="container">
        <h3 class="fw-bolder text-center">Search Flight</h3>
        <center>
            <hr class="bg-primary opacity-100" style="height:3px" width="5%">
        </center>
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-12 col-xs-12">
                <div class="card rounded-0">
                    <div class="card-body">
                        <div class="container-fluid">
                            <form action="{% url 'flights:results' %}" method="get" id="search-flight" data-route-search>
                                <div class="row">
                                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                                        <div class="mb-3">
                                            <label for="from_airport" class="control-label">From</label>
                                            <select id="from_airport" name="from_airport" class="form-select form-select-sm rounded-0 select2" required>
                                                <option value="" disabled {% if not selected_from %}selected{% endif %}></option>
                                                {% for airport in airports %}
                                                    <option value="{{ airport.id }}" {% if airport.id|stringformat:"d" == selected_from %}selected{% endif %}>{{ airport.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="to_airport" class="control-label">To</label>
                                            <select id="to_airport" name="to_airport" class="form-select form-select-sm rounded-0 select2" required>
                                                <option value="" disabled {% if not selected_to %}selected{% endif %}></option>
                                                {% for airport in airports %}
                                                    <option value="{{ airport.id }}" {% if airport.id|stringformat:"d" == selected_to %}selected{% endif %}>{{ airport.name }}</option>
                                                {% endfor %}
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label for="departure" class="control-label">Departure Date</label>
                                            <input type="date" id="departure" name="departure_date" class="form-control form-control-sm rounded-0" value="{{ selected_date }}" min="{{ booking_window.earliest|date:'Y-m-d' }}" max="{{ booking_window.latest|date:'Y-m-d' }}" required>
                                        </div>
                                        <div class="text-center mb-3">
                                            <button class="btn btn-primary btn-lg w-100"><i class="fa fa-search"></i> Search Flight</button>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock pageContent %}
{% block ScriptBlock %}
<script>
  $(function () {
    $('.select2').select2({
      placeholder: 'Please Select Here',
      width: '100%',
      containerCssClass: 'form-control form-control-sm rounded-0'
    });
  });
</script>
{% endblock ScriptBlock %}
