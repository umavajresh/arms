{% extends "base.html" %}
{% block pageContent %}
<style>
    main {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }
</style>
<div class="d-flex flex-column w-100 justify-content-center align-items-center">
    <div class="col-lg-4 col-md-6 col-sm-12 col-xs-12">
        <div class="card card-default rounded-0">
            <div class="card-header">
                <h4 class="card-title"><b>Verify Your Identity</b></h4>
            </div>
            <div class="card-body">
                <div class="container-fluid">
                    <form id="verify-identity-form" action="{% url 'accounts:recovery-verify' %}" method="POST">
                        {% csrf_token %}
                        
                        <div class="mdc-layout-grid">
                            <div class="mdc-layout-grid__inner">
                                <p class="mb-3">To verify your identity, please answer the following security question:</p>
                                
                                <div class="form-group mb-3">
                                    <label class="control-label fw-bold">Security Question:</label>
                                    <p>Your recovery question is hidden for privacy.</p>
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="date_of_birth" class="control-label">Date of Birth</label>
                                    <input type="date" class="form-control rounded-0" name="date_of_birth" id="date_of_birth" required="required">
                                    <small class="form-text text-muted">Please enter your date of birth as MM/DD/YYYY</small>
                                </div>
                                
                                <div class="form-group mb-3">
                                    <label for="security_answer" class="control-label">Your Answer</label>
                                    <input type="text" class="form-control rounded-0" name="security_answer" id="security_answer" required="required">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <a href="{% url 'accounts:recovery-start' %}">Back</a>
                                        <button type="submit" class="btn btn-sm rounded-0 btn-primary">
                                            Verify
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock pageContent %}
