{% extends "base.html" %}
{% block pageContent %}
<style>
    main {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
    }
</style>
<div class="d-flex flex-column w-100 justify-content-center align-items-center">
    <div class="col-lg-4 col-md-6 col-sm-12 col-xs-12">
        <div class="card card-default rounded-0">
            <div class="card-header">
                <h4 class="card-title"><b>Forgot Password</b></h4>
            </div>
            <div class="card-body">
                <div class="container-fluid">
                    <form id="forgot-password-form" action="{% url 'accounts:recovery-start' %}" method="POST">
                        {% csrf_token %}
                        <div class="mdc-layout-grid">
                            <div class="mdc-layout-grid__inner">
                                <p class="text-muted">Please enter your User ID or Username to find your account.</p>
                                
                                <div class="form-group mb-3">
                                    <label for="identifier" class="control-label">User ID or Username</label>
                                    <input type="text" class="form-control rounded-0" autofocus name="identifier" id="identifier" required="required">
                                </div>
                                
                                <div class="form-group mb-3">
                                    <div class="d-flex w-100 justify-content-between align-items-center">
                                        <a href="{% url 'accounts:login' %}">Back to Login</a>
                                        <button type="submit" class="btn btn-sm rounded-0 btn-primary">
                                            Continue
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock pageContent %}
