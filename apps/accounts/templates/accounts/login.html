{% extends "base.html" %}
{% block headerContent %}
<style>
  main {
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }
</style>
{% endblock headerContent %}
{% block pageContent %}
<div class="d-flex flex-column w-100 justify-content-center align-items-center">
  <div class="col-lg-4 col-md-6 col-sm-12">
    <div class="card card-default rounded-0">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0"><b>Passenger Login</b></h4>
        <span class="badge bg-dark border text-light rounded-0">ARMS 2.0</span>
      </div>
      <div class="card-body">
        <div class="container-fluid">
          <form id="login-user" action="{% url 'accounts:login' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group mb-3">
              <label for="username" class="control-label">User ID</label>
              <input type="text" class="form-control rounded-0" autofocus name="username" id="username" required placeholder="Enter your User ID or Username">
            </div>
            <div class="form-group mb-3">
              <label for="password" class="control-label">Password</label>
              <input type="password" class="form-control rounded-0" name="password" id="password" required>
            </div>
            <div class="form-group mb-3">
              <div class="d-flex w-100 justify-content-between align-items-center">
                <a href="{% url 'pages:landing' %}">Go Back</a>
                <button class="btn btn-sm rounded-0 btn-primary">Login</button>
              </div>
            </div>
            <div class="form-group mb-0">
              <div class="d-flex w-100 justify-content-between align-items-center">
                <a href="{% url 'accounts:register' %}">Create an account</a>
                <a href="{% url 'accounts:recovery-start' %}">Forgot Password?</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock pageContent %}
{% block ScriptBlock %}
<script>
  $(function () {
    $('#login-user').on('submit', function (event) {
      event.preventDefault();
      armsPostForm(this, this.action, function (response) {
        location.href = response.redirect;
      });
    });
  });
</script>
{% endblock ScriptBlock %}
