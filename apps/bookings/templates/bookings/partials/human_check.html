<div class="input-group">
  <div class="input-group-text bg-light">
    <strong>{{ first }} + {{ second }} = ?</strong>
  </div>
  <input type="text" name="check_answer" id="id_check_answer" class="form-control" placeholder="Enter answer" inputmode="numeric" required>
  <button type="button" class="btn btn-outline-secondary" onclick="refreshCaptcha()" aria-label="Refresh security check">
    <i class="fas fa-sync-alt"></i>
  </button>
</div>
<small class="text-muted">Solve the math problem to verify you're human</small>
